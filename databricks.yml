# databricks.yml — standalone Catastrophe Command demo
bundle:
  name: caspers-catastrophe

variables:
  catalog:
    description: "UC catalog. Deploy: --var catalog=<name>. Cleanup script: BUNDLE_VAR_catalog=<name> (bundle run does not take --var)."
    default: devconnect

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/caspers-catastrophe-demo
  file_path: ${workspace.root_path}

sync:
  include:
    - ./*
  exclude:
    - .git/**
    - .DS_Store
    - .claude/**
    - .databricks/**
    - .venv/**
    - .bundle/**
    - __pycache__/**
    - "*.pyc"
    - apps/**/.databricks/**
    - apps/**/node_modules/**
    - apps/**/dist/**
    # Generated at runtime by stages/catastrophe_command.ipynb
    - apps/catastrophe-command/app.yaml

scripts:
  cleanup:
    # Scripts ignore --var and --params. Override catalog with:
    #   BUNDLE_VAR_catalog=<name> databricks bundle run cleanup
    # (${var.*} cannot go in content; resolve it here and pass as $CATALOG.)
    env:
      CATALOG: ${var.catalog}
      FILE_PATH: ${workspace.file_path}
    content: |
      set -eo pipefail

      echo "Cleaning up catalog: $CATALOG"

      mkdir -p .bundle
      cat > .bundle/submit.json <<JSON
      {
        "run_name": "caspers-catastrophe: cleanup (ephemeral)",
        "tasks": [
          {
            "task_key": "destroy",
            "notebook_task": {
              "notebook_path": "$FILE_PATH/destroy",
              "source": "WORKSPACE",
              "base_parameters": { "CATALOG": "$CATALOG" }
            }
          }
        ]
      }
      JSON

      databricks jobs submit --json @.bundle/submit.json

targets:
  default:
    default: true
    variables:
      catalog:
        default: devconnect
    resources:
      sql_warehouses:
        ops_warehouse:
          name: ${var.catalog}-ops
          cluster_size: 2X-Small
          min_num_clusters: 1
          max_num_clusters: 1
          auto_stop_mins: 60
          enable_serverless_compute: true
          warehouse_type: PRO
      dashboards:
        catastrophe_command_center:
          display_name: "Delivery Catastrophe Command Center (${var.catalog})"
          file_path: ./resources/dashboards/catastrophe_command_center.lvdash.json
          warehouse_id: ${resources.sql_warehouses.ops_warehouse.id}
          dataset_catalog: ${var.catalog}
      jobs:
        caspers:
          name: "Catastrophe Command Initializer"
          queue:
            enabled: true
          performance_target: PERFORMANCE_OPTIMIZED

          # CATALOG / warehouse name default from ${var.catalog}. Do not also
          # set notebook base_parameters — DAB forbids mixing those with job
          # parameters. Notebooks inherit these as widgets.
          parameters:
            - name: CATALOG
              default: ${var.catalog}
            - name: SIMULATOR_SCHEMA
              default: metadata
            - name: OPS_WAREHOUSE_NAME
              default: ${var.catalog}-ops
            - name: AI_GATEWAY_ENDPOINT_NAME
              default: ""
              # Empty => {catalog}.default.command-agent, created by Catastrophe_Command.
            - name: AGENT_LLM_FALLBACK
              default: ""
            - name: HISTORY_TARGET_ORDERS
              default: "2000000"
            - name: HISTORY_DAYS
              default: "90"

          tasks:
            - task_key: Canonical_Data
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/canonical_data

            - task_key: Lakebase_Project
              depends_on:
                - task_key: Canonical_Data
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/lakebase_project

            - task_key: Catastrophe_History
              depends_on:
                - task_key: Canonical_Data
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/catastrophe_history

            - task_key: Catastrophe_Hist_Lakebase
              depends_on:
                - task_key: Catastrophe_History
                - task_key: Lakebase_Project
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/catastrophe_hist_lakebase

            - task_key: Catastrophe_Command
              depends_on:
                - task_key: Lakebase_Project
                - task_key: Catastrophe_History
                - task_key: Catastrophe_Hist_Lakebase
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/catastrophe_command

            - task_key: Catalog_Commits
              depends_on:
                - task_key: Catastrophe_Command
              notebook_task:
                notebook_path: ${workspace.root_path}/stages/catalog_commits
